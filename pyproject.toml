[project]
name = "data-preprocessing-service"
version = "0.1.0"
description = "Runtime-local document extraction, immutable products, and agent navigation."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "pdfplumber>=0.11.10",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pypdfium2>=4.30",
    "defusedxml>=0.7",
    "starlette>=0.47",
    "uvicorn>=0.35",
    "mcp>=1.20,<2",
    "httpx>=0.28",
]

[project.scripts]
preprocess = "preprocessing.cli:main"
preprocess-engine-owner = "preprocessing.engine_owner:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "reportlab>=4", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests/preprocessing"]
asyncio_mode = "auto"
