[project]
name = "extract-reports"
version = "0.1.0"
description = "Decompose NI 43-101 technical report PDFs into structured per-report directories (text / tables / figures) for a downstream analysis pipeline."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.112.0",
    "mistralai>=1.0",
    "pandas>=2.0",
    "pdfplumber>=0.11.10",
    "pillow>=10.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
extract-reports = "pipeline.run:main"
analyze-report = "analysis.run:main"
geo-report-mcp = "analysis.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "analysis"]
